[phases.setup]
nixPkgs = ['php84', 'composer', 'nodejs_20']

[phases.build]
cmds = [
    'npm ci',
    'npm run build',
    'composer install --no-dev --optimize-autoloader'
]

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT'